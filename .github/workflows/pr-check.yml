name: PR Check

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-verify:
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-pr-verify.yml@main
    with:
      node_app_directories: '["feedwatcher-server", "feedwatcher-web"]'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}

  layout-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          npm ci --prefix feedwatcher-server
          npm ci --prefix feedwatcher-web
      - name: Build web app
        run: npm run generate --prefix feedwatcher-web
      - name: Run layout invariant checks
        run: |
          npm ci --prefix feedwatcher-web/layout-checks
          npm run check --prefix feedwatcher-web/layout-checks
